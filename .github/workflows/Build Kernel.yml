name: Build Kernel for MT6853

on:
  workflow_dispatch:
    inputs:

      BBR:
        type: boolean
        description: "是否启用 BBR 加速（不了解请不要启用）"
        required: false
        default: true
        
      DroidSpace:
        type: boolean
        description: "是否启用 DroidSpace（不了解请不要启用）"
        required: false
        default: false



      TG:
        type: boolean
        description: "!!!请勿开启!!!/Don't Open"
        required: false
        default: false

      Branch:
        type: choice
        description: "选择要 clone 的分支（仅供开发者选择）"
        required: true
        default: main
        options:
          - main
          - bpf

    
jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download GCC toolchain
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        
        mkdir gcc64
        wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc64/ -zxvf gcc-aarch64.tar.gz
    
        mkdir gcc32
        wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc32/ -zxvf gcc-arm.tar.gz
    
    - name: Install Clang toolchain
      run: |
        sudo apt install -y clang lld llvm
    
    - name: Clone kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        CLONE_BRANCH="${{ github.event.inputs.Branch }}"
        echo "使用 $CLONE_BRANCH 分支"
        git clone -b "$CLONE_BRANCH" --single-branch https://github.com/sanba0519/OPPO-Realme_kernel_4.14_MT6853.git android-kernel
        cd android-kernel




    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-mido-kernel
        max-size: 3G

 
    - name: Configure and build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_HOST=coolapk@sanba
        export KBUILD_BUILD_USER=GitHub@sanba0519

        # 首先生成初始 .config（无论选项如何都必须执行）
        make -j$(nproc --all) O=out ARCH=arm64 mt6853-ss_defconfig

        # DroidSpace
        if [ "${{ github.event.inputs.DroidSpace }}" = "true" ]; then
          echo "启用 DroidSpace..."
          ./scripts/config --file out/.config \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable NET_NS \
            --enable MULTIUSER \
            --disable USER_NS \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable FW_LOADER_COMPRESS \
            --enable VETH \
            --enable BRIDGE \
            --enable NETFILTER \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NF_CONNTRACK \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable NF_NAT \
            --enable NF_TABLES \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NF_CONNTRACK_NETLINK \
            --enable NF_NAT_REDIRECT \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES \
            --enable NF_CONNTRACK_IPV4 \
            --enable NF_NAT_IPV4 \
            --enable IP_NF_NAT \
            --enable NETFILTER_XT_MATCH_COMMENT \
            --enable NETFILTER_XT_MATCH_STATE \
            --enable NETFILTER_XT_MATCH_CONNTRACK \
            --enable NETFILTER_XT_MATCH_MULTIPORT \
            --enable NETFILTER_XT_MATCH_HL \
            --enable NETFILTER_XT_TARGET_REJECT \
            --enable IP_NF_TARGET_REJECT \
            --enable NETFILTER_XT_TARGET_LOG \
            --enable IP_NF_TARGET_ULOG \
            --enable NETFILTER_XT_MATCH_RECENT \
            --enable NETFILTER_XT_MATCH_LIMIT \
            --enable NETFILTER_XT_MATCH_HASHLIMIT \
            --enable NETFILTER_XT_MATCH_OWNER \
            --enable NETFILTER_XT_MATCH_PKTTYPE \
            --enable NETFILTER_XT_MATCH_MARK \
            --enable NETFILTER_XT_TARGET_MARK \
            --enable IP_SET \
            --enable IP_SET_HASH_IP \
            --enable IP_SET_HASH_NET \
            --enable NETFILTER_XT_SET \
            --enable NETFILTER_NETLINK_QUEUE \
            --enable NETFILTER_NETLINK_LOG \
            --enable NETFILTER_XT_TARGET_NFLOG \
            --disable ANDROID_PARANOID_NETWORK
          make O=out olddefconfig
        else
          echo "不启用 DroidSpace，使用默认配置"
        fi

        # BBR
        if [ "${{ github.event.inputs.BBR }}" = "true" ]; then
          echo "启用 BBR..."
          ./scripts/config --file out/.config \
            --enable CONFIG_TCP_CONG_BBR \
            --enable CONFIG_NET_SCH_FQ
          make O=out olddefconfig
        else
          echo "不启用 BBR..."
        fi

        # 最终配置修正
        ./scripts/config --file out/.config \
                --enable CONFIG_NAMESPACES \
                --enable CONFIG_DEVTMPFS \
                --disable CONFIG_USER_NS \
                --enable CONFIG_DEVTMPFS_MOUNT \
                --enable CONFIG_SECTION_MISMATCH_WARN_ONLY



        make O=out ARCH=arm64 olddefconfig

        # 编译
        make -j"$(nproc)" \
                O=out \
                ARCH=arm64 \
                CC="ccache clang" \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-android- \
                CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                CFLAGS_KERNEL="-fintegrated-as" \
                CFLAGS_MODULE="-fintegrated-as" \
                LD=ld.lld \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip

    - name: Generate artifact name
      id: gen_name
      run: |
        if [ "${{ github.event.inputs.SU }}" = "ReSukiSU" ]; then
          NAME="MT6853-ReSukiSU"
        else
          NAME="MT6853-RKSU"
        fi
        if [ "${{ github.event.inputs.BBR }}" = "true" ]; then
          NAME="${NAME}-BBR"
        fi
        if [ "${{ github.event.inputs.DroidSpace }}" = "true" ]; then
          NAME="${NAME}-DroidSpace"
        fi
        if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
          NAME="${NAME}-SUSFS"
        fi
        echo "artifact_name=${NAME}" >> $GITHUB_OUTPUT
                
    - name: Package AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/sanba0519/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

        ZIP_NAME="${{ steps.gen_name.outputs.artifact_name }}.zip"
        (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" .)
        ls -lh "${ZIP_NAME}"

    - name: Upload AnyKernel3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{steps.gen_name.outputs.artifact_name}}
        path: |
          kernel_workspace/AnyKernel3/*
          !kernel_workspace/AnyKernel3/*.zip

    - name: Generate Telegram caption
      id: gen_caption
      run: |

        COMMIT_SHA=$(git rev-parse --short HEAD)
        COMMIT_MSG=$(git log -1 --pretty=format:'%s')
        {
          echo "caption<<EOF"
          echo "<pre>"
          echo "🔧 Commit: ${COMMIT_SHA} - ${COMMIT_MSG}"
          echo ""
          echo "Kernel Info:"
          echo ""
          echo "欧加真我 MT6853 通用内核 -- A12"
          echo "Oplus/Realme MT6853 Universal Kernel -- A12"
          echo ""
          echo "📦 Feature:"
          if [ "${{ github.event.inputs.SU }}" = "RKSU" ]; then
            echo "Root方案:  RKSU"
          else
            echo "Root方案:  ReSukiSU"
          fi
          if [ "${{ github.event.inputs.BBR }}" = "true" ]; then
            echo "✅ BBR"
          else
            echo "❌ BBR"
          fi
          if [ "${{ github.event.inputs.DroidSpace }}" = "true" ]; then
            echo "✅ DroidSpace"
          else
            echo "❌ DroidSpace"
          fi
          if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
            echo "✅ SUSFS-V2.2.0"
          else
            echo "❌ SUSFS-V2.2.0"
          fi
          echo "</pre>"
          echo " "
          echo "Follow👉:@mt6853o"
          echo "Dev: @sanba_0519"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Upload to Telegram
      env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_CI_SESSION: ${{ secrets.BOT_CI_SESSION }}
          CAPTION: ${{ steps.gen_caption.outputs.caption }}
      run: |
        if [ "${{ github.event.inputs.TG }}" != "true" ]; then
          echo "------------跳过 Telegram 上传------------"
          exit 0
        fi

        ZIP_PATH="$GITHUB_WORKSPACE/kernel_workspace/${{ steps.gen_name.outputs.artifact_name }}.zip"
        if [ ! -f "$ZIP_PATH" ]; then
          echo "找不到待上传文件: $ZIP_PATH"
          ls -la "$GITHUB_WORKSPACE/kernel_workspace" || true
          exit 1
        fi

        echo "------------正在上传到 Telegram------------"
        pip3 install telethon
        python3 "$GITHUB_WORKSPACE/.github/bot.py" --caption "$CAPTION" "$ZIP_PATH"

      
      
