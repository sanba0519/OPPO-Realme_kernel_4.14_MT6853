name: Build Kernel for MT6853

on:
  workflow_dispatch:
    inputs:

      SU:
        type: choice
        description: "选择要使用的 Root 管理器"
        required: true
        default: RKSU
        options:
          - RKSU
          - ReSukiSU

      BBR:
        type: boolean
        description: "是否启用 BBR 加速（不了解请不要启用）"
        required: false
        default: true
        
      DroidSpace:
        type: boolean
        description: "是否启用 DroidSpace（不了解请不要启用）"
        required: false
        default: false

      SUSFS:
        type: boolean
        description: "是否加入 SUSFS"
        required: false
        default: false


      TG:
        type: boolean
        description: "!!!请勿开启!!!/Don't Open"
        required: false
        default: false

      Branch:
        type: choice
        description: "选择要 clone 的分支（仅供开发者选择）"
        required: true
        default: main
        options:
          - main

    
jobs:
  build:

    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 python2 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download GCC toolchain
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        
        mkdir gcc64
        wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc64/ -zxvf gcc-aarch64.tar.gz
    
        mkdir gcc32
        wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc32/ -zxvf gcc-arm.tar.gz
    
    - name: Download Clang toolchain
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp
    
    
    - name: Clone kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        CLONE_BRANCH="${{ github.event.inputs.Branch }}"
        echo "使用 $CLONE_BRANCH 分支"
        git clone -b "$CLONE_BRANCH" --single-branch https://github.com/sanba0519/OPPO-Realme_kernel_4.14_MT6853.git android-kernel
        cd android-kernel

    - name: Apply patch
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        if [ "${{ github.event.inputs.SU }}" = "RKSU" ]; then
          echo "KSU_LOG: 选择了 RKSU"
          echo "KSU_LOG: 开始下载并应用 RKSU 官方 4.14 patch"
          wget https://github.com/rksuorg/kernel_patches/raw/master/manual_hook/kernel-4.14.patch -O ksu-4.14.patch || { echo "下载 patch 失败"; exit 1; }
          patch -p1 < ksu-4.14.patch || { echo "patch 应用失败"; cat ksu-4.14.patch; exit 1; }

        elif [ "${{ github.event.inputs.SU }}" = "ReSukiSU" ]; then
          echo "KSU_LOG: 选择了 ReSukiSU"
          if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
            echo "KSU_LOG: SUSFS 使用 ReSukiSU inline hooks，跳过 4.14 manual hook patch"
          else
            echo "KSU_LOG: 开始下载并应用 ReSukiSU 官方 4.14 manual hook patch"
            wget -O resukisu-4.14.patch \
                https://raw.githubusercontent.com/ReSukiSU/ReSukiSU_Patches/main/scope-minimized/kernel-4.14.patch \
              || { echo "下载 ReSukiSU 官方 patch 失败"; exit 1; }
            patch -p1 < resukisu-4.14.patch || { echo "ReSukiSU 官方 patch 应用失败"; cat resukisu-4.14.patch; exit 1; }
          fi

        else
          echo "KSU_LOG: 未知的 SU 选项，默认使用 RKSU"
        fi

        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
          echo "KSU_LOG: 开启 SUSFS"
          wget https://raw.githubusercontent.com/sanba0519/Kernel-patch/refs/heads/main/USeless/susfs_patch_to_4.14-bak.patch -O susfs-4.14.patch
          patch -p1 < susfs-4.14.patch || { echo "SUSFS patch 应用失败"; exit 1; }
          # A label cannot be followed directly by a declaration in GNU C89.
          sed -i 's/^orig_flow:$/orig_flow:;/' fs/notify/fdinfo.c
          grep -q '^orig_flow:;$' fs/notify/fdinfo.c \
            || { echo "SUSFS fdinfo 4.14 兼容修正失败"; exit 1; }
        fi


    - name: Setup KernelSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        rm -rf KernelSU
        if [ "${{ github.event.inputs.SU }}" = "ReSukiSU" ]; then
          echo "KSU_LOG: Setup ReSukiSU"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
            echo "KSU_LOG: 应用 ReSukiSU SUSFS inline hooks"
            curl -LfsS \
              https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh \
              -o susfs_inline_hook_patches.sh \
              || { echo "下载 SUSFS inline hook 脚本失败"; exit 1; }
            bash susfs_inline_hook_patches.sh
          fi
        else
          echo "KSU_LOG: Setup RKSU (rsuntk)"
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main
        fi

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-mido-kernel
        max-size: 3G

 
    - name: Configure and build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_HOST=coolapk@sanba
        export KBUILD_BUILD_USER=GitHub@sanba0519

        # 首先生成初始 .config（无论选项如何都必须执行）
        make -j$(nproc --all) O=out ARCH=arm64 mt6853-ss_defconfig

        # DroidSpace
        if [ "${{ github.event.inputs.DroidSpace }}" = "true" ]; then
          echo "启用 DroidSpace..."
          ./scripts/config --file out/.config \
            --enable NAMESPACES \
            --enable USER_NS \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT
          make O=out olddefconfig
        else
          echo "不启用 DroidSpace..."
        fi

        # BBR
        if [ "${{ github.event.inputs.BBR }}" = "true" ]; then
          echo "启用 BBR..."
          ./scripts/config --file out/.config \
            --enable CONFIG_TCP_CONG_BBR \
            --enable CONFIG_NET_SCH_FQ
          make O=out olddefconfig
        else
          echo "不启用 BBR..."
        fi

        # 最终配置修正
        ./scripts/config --file out/.config \
                --enable CONFIG_NAMESPACES \
                --enable CONFIG_DEVTMPFS \
                --disable CONFIG_USER_NS \
                --enable CONFIG_DEVTMPFS_MOUNT

        # ReSukiSU: SUSFS selects the inline hook method; otherwise use manual hooks.
        if [ "${{ github.event.inputs.SU }}" = "ReSukiSU" ]; then
          if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
            echo "KSU_LOG: 启用 CONFIG_KSU + CONFIG_KSU_SUSFS inline hook"
            ./scripts/config --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_SUSFS \
              --disable CONFIG_KSU_MANUAL_HOOK \
              --disable CONFIG_KSU_TRACEPOINT_HOOK
          else
            echo "KSU_LOG: 启用 CONFIG_KSU + CONFIG_KSU_MANUAL_HOOK"
            ./scripts/config --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_MANUAL_HOOK \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_KSU_TRACEPOINT_HOOK
          fi
        fi

        make O=out ARCH=arm64 olddefconfig

        # 编译
        make -j"$(nproc)" \
                O=out \
                ARCH=arm64 \
                CC="ccache clang" \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-android- \
                CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                LD=ld.lld

    - name: Generate artifact name
      id: gen_name
      run: |
        if [ "${{ github.event.inputs.SU }}" = "ReSukiSU" ]; then
          NAME="MT6853-ReSukiSU"
        else
          NAME="MT6853-RKSU"
        fi
        if [ "${{ github.event.inputs.BBR }}" = "true" ]; then
          NAME="${NAME}-BBR"
        fi
        if [ "${{ github.event.inputs.DroidSpace }}" = "true" ]; then
          NAME="${NAME}-DroidSpace"
        fi
        if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
          NAME="${NAME}-SUSFS"
        fi
        echo "artifact_name=${NAME}" >> $GITHUB_OUTPUT
                
    - name: Package AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/sanba0519/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

        ZIP_NAME="${{ steps.gen_name.outputs.artifact_name }}.zip"
        (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" .)
        ls -lh "${ZIP_NAME}"

    - name: Upload AnyKernel3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{steps.gen_name.outputs.artifact_name}}
        path: kernel_workspace/${{ steps.gen_name.outputs.artifact_name }}.zip

    - name: Generate Telegram caption
      id: gen_caption
      run: |

        COMMIT_SHA=$(git rev-parse --short HEAD)
        COMMIT_MSG=$(git log -1 --pretty=format:'%s')
        {
          echo "caption<<EOF"
          echo "<pre>"
          echo "🔧 Commit: ${COMMIT_SHA} - ${COMMIT_MSG}"
          echo ""
          echo "Kernel Info:"
          echo ""
          echo "欧加真我 MT6853 通用内核 -- A12"
          echo "Oplus/Realme MT6853 Universal Kernel -- A12"
          echo ""
          echo "📦 Feature:"
          if [ "${{ github.event.inputs.SU }}" = "RKSU" ]; then
            echo "✅ RKSU"
          else
            echo "✅ ReSukiSU"
          fi
          if [ "${{ github.event.inputs.BBR }}" = "true" ]; then
            echo "✅ BBR"
          else
            echo "❌ BBR"
          fi
          if [ "${{ github.event.inputs.DroidSpace }}" = "true" ]; then
            echo "✅ DroidSpace"
          else
            echo "❌ DroidSpace"
          fi
          if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
            echo "✅ SUSFS-V2.2.0"
          else
            echo "❌ SUSFS-V2.2.0"
          fi
          echo "</pre>"
          echo "EOF"
          echo " "
          echo "Follow👉:@mt6853o"
          echo "Dev: @sanba_0519"
        } >> "$GITHUB_OUTPUT"

    - name: Upload to Telegram
      env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_CI_SESSION: ${{ secrets.BOT_CI_SESSION }}
          CAPTION: ${{ steps.gen_caption.outputs.caption }}
      run: |
        if [ "${{ github.event.inputs.TG }}" != "true" ]; then
          echo "------------跳过 Telegram 上传------------"
          exit 0
        fi

        ZIP_PATH="$GITHUB_WORKSPACE/kernel_workspace/${{ steps.gen_name.outputs.artifact_name }}.zip"
        if [ ! -f "$ZIP_PATH" ]; then
          echo "找不到待上传文件: $ZIP_PATH"
          ls -la "$GITHUB_WORKSPACE/kernel_workspace" || true
          exit 1
        fi

        echo "------------正在上传到 Telegram------------"
        pip3 install telethon
        python3 "$GITHUB_WORKSPACE/.github/bot.py" --caption "$CAPTION" "$ZIP_PATH"

      
      
