name: Build OppoK7x (PERM00) (Color A12)（MT6853）

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 构建编译内核环境
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 python2 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: 下载 Gcc编译器
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir gcc64
          wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxvf gcc-aarch64.tar.gz
          
          mkdir gcc32
          wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxvf gcc-arm.tar.gz

      - name: 下载Clang编译器
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir clang-aosp
          git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

      - name: 下载内核源码
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/sanba0519/android_kernel_4.14_MT6853_PERM00 android-kernel
          cd android-kernel

      - name: 确认并最终适配 SukiSU-Ultra（使用仓库中已 push 的版本 + 4.14 补丁）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
    
          # 先检查 kernelsu 是否存在（调试用）
          if [ ! -d "drivers/kernelsu" ]; then
            echo "错误：drivers/kernelsu 不存在！请确认已 push 集成好的 SukiSU"
            ls -la drivers/
            exit 1
          fi
          
          # 确认 app_profile.c 存在并已改（可选调试）
          if [ -f "drivers/kernelsu/app_profile.c" ]; then
            echo "找到 app_profile.c，检查 filter_count 是否已禁用："
            grep -i "filter_count" drivers/kernelsu/app_profile.c || echo "未找到 filter_count 关键字（已禁用或无此代码）"
          else
            echo "警告：drivers/kernelsu/app_profile.c 不存在，使用 SukiSU 标准结构？"
            # 如果你的集成是 ln -s KernelSU/kernel drivers/kernelsu，这里补救
            if [ -d "KernelSU/kernel" ]; then
              ln -sf KernelSU/kernel drivers/kernelsu
            fi
          fi
          
          # Kconfig & Makefile 确保添加（幂等，不会重复）
          grep -q "kernelsu/" drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu/Kconfig" drivers/Kconfig || echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig
          
          # 小修补（MODULE_IMPORT_NS 是新内核的，4.14 无需）
          sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/ksu.c || true
          
          # allowlist.c 修补（如果存在）
          if [ -f drivers/kernelsu/allowlist.c ]; then
            sed -i 's/TWA_RESUME/true/g' drivers/kernelsu/allowlist.c
            sed -i 's/TWA_SIGNAL/true/g' drivers/kernelsu/allowlist.c
          fi
          
          # 新增：强制修复 selinux/selinux.c 中的 const 问题（Clang 不允许修改 const 指针）
          if [ -f "drivers/kernelsu/selinux/selinux.c" ]; then
            echo "检测到 selinux/selinux.c，正在移除 const 以兼容 Clang + 4.14"
            sed -i 's/const struct task_security_struct \*tsec/struct task_security_struct *tsec/g' drivers/kernelsu/selinux/selinux.c
            sed -i 's/const struct task_security_struct \*tsec = /struct task_security_struct *tsec = /g' drivers/kernelsu/selinux/selinux.c
            sed -i 's/const struct task_security_struct \*/struct task_security_struct */g' drivers/kernelsu/selinux/selinux.c
            echo "已移除 const，显示修改附近代码（调试）："
            grep -C 5 "task_security_struct" drivers/kernelsu/selinux/selinux.c || echo "无匹配行"
          else
            echo "未找到 selinux/selinux.c，无需 const 修复（可能是最新版结构）"
          fi
          
          echo "SukiSU-Ultra 已确认集成，使用仓库中版本 + const 修复（filter_count 应已手动禁用）"
          
      - name: 修复 Kconfig 非法字符与换行符
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "[+] 正在清理 Kconfig 中的非法回车符..."
          find . -type f -name "Kconfig*" -exec sed -i 's/\r$//' {} +
      - name: 生成并修正内核配置（非交互 + 4.14 保险配置）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          make O=out ARCH=arm64 mt6853-ss_defconfig LOCALVERSION="-酷安-三笆-GitHub-@sanba0519"
          
          CONFIG_FILE="out/.config"
          cp "$CONFIG_FILE" "$CONFIG_FILE.bak"
          
          cat << EOF >> "$CONFIG_FILE"
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_MODULES_USE_ELF_RELA=y
          EOF
          
          make O=out ARCH=arm64 olddefconfig
          
          echo "关键配置检查："
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULES|CONFIG_OVERLAY_FS" "$CONFIG_FILE"
          
      - name: 设置ccache缓存
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-mt6853-sukisu-${{ github.run_id }}
          max-size: 2G

      - name: 开始编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
           
          make O=out clean || true
          make O=out mrproper || true
          export KBUILD_BUILD_HOST=GitHub@sanba0519
          export KBUILD_BUILD_USER=GitHub@sanba0519
          
          make -s O=out ARCH=arm64 mt6853-ss_defconfig LOCALVERSION="-酷安-三笆-GitHub-@sanba0519"
          make -j12 CC="ccache clang" O=out ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld
      - name: 制作Anykernel3卡刷包
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
      - name: 上传 Anykernel3
        uses: actions/upload-artifact@v4
        with:
          name: android-mtk6853-kernel-Anykernel3
          path: kernel_workspace/AnyKernel3/*

      - name: 上传编译内核
        uses: actions/upload-artifact@v4
        with:
          name: mtk6853-Image.gz
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz