name: Build(rsuntk KSU)OppoK7x (PERM00) (Color A12)

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 安装编译环境依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          git make bc bison ccache openssl dos2unix zip unzip kmod cpio flex \
          libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates \
          python3 python-is-python3 binutils binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi gcc-multilib g++-multilib libc6-dev-i386 \
          libncurses5 libncursesw5-dev rsync

        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: 下载 GCC 工具链（Google 4.9）
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p gcc64 gcc32
        wget -qO gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc64/ -xzf gcc-aarch64.tar.gz
        wget -qO gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc32/ -xzf gcc-arm.tar.gz

    - name: 下载 Clang（crDroid clang-10）
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/sanba0519/android_kernel_4.14_MT6853 android-kernel
        cd android-kernel

    - name: 手动集成 rsuntk KernelSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        rm -rf drivers/kernelsu
        git clone --depth=1 https://github.com/rsuntk/KernelSU drivers/kernelsu -b main

        cd drivers
        echo 'source "kernelsu/kernel/Kconfig"' >> Kconfig
        echo "obj-\$(CONFIG_KSU) += kernelsu/kernel/" >> Makefile

        tail -n 5 Kconfig > $GITHUB_WORKSPACE/kconfig_tail.txt
        ls -l kernelsu/kernel > $GITHUB_WORKSPACE/ksu_dir_check.txt

    - name: 注入 Minimalist Hooks (手动钩子)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        # 给 fs/open.c 打钩子
        sed -i '/long do_sys_open(int dfd, const char __user \*filename, int flags, umode_t mode)/a \
        extern int ksu_handle_faccessat(int *dfd, const char __user **filename, int *mode, int *flags);\
        ksu_handle_faccessat(&dfd, &filename, &mode, &flags);' fs/open.c

        # 给 fs/exec.c 打钩子（补全截断部分）
        sed -i '/int search_binary_handler(struct linux_binprm \*bprm, struct pt_regs \*regs)/a \
        extern int ksu_handle_execveat(int *fd, struct filename **filename, void *argv, void *envp, int *flags);\
        ksu_handle_execveat(&bprm->fd, &bprm->filename, &bprm->argc, &bprm->envp, &bprm->flags);' fs/exec.c

        # 调试输出是否打成功
        grep -i ksu_handle fs/open.c fs/exec.c > $GITHUB_WORKSPACE/hook_check.txt || echo "Hook not applied" > $GITHUB_WORKSPACE/hook_check.txt

    - name: 配置内核并开启 KSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64

        rm -rf out/
        make O=out mt6853-ss_defconfig

        scripts/config --file out/.config --enable KSU
        scripts/config --file out/.config --enable KSU_MANUAL_HOOK
        scripts/config --file out/.config --disable KSU_USE_KPROBES

        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- olddefconfig

        grep -i ksu out/.config > $GITHUB_WORKSPACE/ksu_config.txt || echo "No KSU config found" > $GITHUB_WORKSPACE/ksu_config.txt

    - name: 设置 ccache 加速编译
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: mtk6853-rsuntk-ksu-${{ github.sha }}
        max-size: 3G

    - name: 开始编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_HOST="GitHub@sanba0519"
        export KBUILD_BUILD_USER="coolapk-sanba"

        make -j$(nproc --all) O=out \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LD=ld.lld \
          Image.gz-dtb 2>&1 | tee build.log

    - name: 制作Anykernel3卡刷包（强制 permissive）
      if: success()
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=/dev/block/by-name/boot;!g' anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh

        echo 'cmdline+=" androidboot.selinux=permissive"' >> anykernel.sh

        cp ../android-kernel/out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb
        rm -rf .git* README.md

    - name: 上传 Anykernel3
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-mtk6853-kernel-Anykernel3
        path: kernel_workspace/AnyKernel3/*

    - name: 上传编译内核
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: mtk6853-Image.gz
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz

    - name: 上传日志 & 调试文件
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-and-ksu-debug
        path: |
          kernel_workspace/android-kernel/build.log
          kernel_workspace/ksu_config.txt
          kernel_workspace/kconfig_tail.txt
          kernel_workspace/hook_check.txt
          kernel_workspace/ksu_dir_check.txt
          kernel_workspace/clone_check.txt